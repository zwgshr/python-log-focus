name: Release Extension

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-and-publish:
    name: Build & Publish Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Tests
        run: pnpm test

      - name: Package Extension (.vsix)
        run: |
          pnpm run package
          VSIX_FILE=$(ls *.vsix | head -n 1)
          echo "VSIX_FILE=${VSIX_FILE}" >> $GITHUB_ENV
          echo "Found VSIX package: ${VSIX_FILE}"

      - name: Publish to VS Code Marketplace
        if: env.VSCE_PAT != ''
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          npx @vscode/vsce publish --packagePath "${{ env.VSIX_FILE }}" --skip-duplicate -p "${{ secrets.VSCE_PAT }}"

      - name: Publish to Open VSX Registry
        if: env.OVSX_PAT != ''
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          npx ovsx publish "${{ env.VSIX_FILE }}" --skip-duplicate -p "${{ secrets.OVSX_PAT }}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: ${{ env.VSIX_FILE }}
          generate_release_notes: true
